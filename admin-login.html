<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Campus Maintenance</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="login-container">
        <div class="login-box admin-box">
            <h1>Admin Portal Login</h1>
            <p>Authorized access for Maintenance Staff & Management</p>

            <div class="demo-badge">
                💡 <strong>Demo Credentials for Review:</strong><br>
                Email: <code>admin@campus.edu</code> | Password: <code>admin123</code>
            </div>

            <div id="alertMessage" class="alert-box" style="display: none;"></div>

            <form id="adminLoginForm">
                <label for="email">Admin Email</label>
                <input type="email" id="email" value="admin@campus.edu" placeholder="Enter admin email" required>

                <label for="password">Password</label>
                <input type="password" id="password" value="admin123" placeholder="Enter admin password" required>

                <button type="submit" class="btn-admin">Login as Admin</button>
            </form>

            <div class="back-home">
                <a href="../index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const alertBox = document.getElementById("alertMessage");

            alertBox.style.display = "none";

            try {
                const response = await fetch("/admin-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("admin", JSON.stringify(data.admin));
                    alertBox.className = "alert-box success";
                    alertBox.textContent = "Admin Login Successful! Redirecting...";
                    alertBox.style.display = "block";

                    setTimeout(() => {
                        window.location.href = "admin-dashboard.html";
                    }, 500);
                } else {
                    alertBox.className = "alert-box error";
                    alertBox.textContent = data.message || "Invalid admin credentials";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Server connection error. Please ensure server is running.";
                alertBox.style.display = "block";
            }
        });
    </script>

</body>

</html>
