<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Campus Maintenance</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Student Login</h1>
            <p>Login to report and track maintenance issues</p>

            <!-- Continue with Google Button -->
            <button type="button" id="googleLoginBtn" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider">
                <span>OR LOGIN WITH EMAIL</span>
            </div>

            <div id="alertMessage" class="alert-box" style="display: none;"></div>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter student email (e.g., john@student.edu)" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password (e.g., student123)" required>

                <button type="submit">Login to Dashboard</button>
            </form>

            <p class="register-text">
                Don't have an account?
                <a href="student-register.html">Register here</a>
            </p>

            <div class="back-home">
                <a href="../index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Google Account Selection Modal UI -->
    <div id="googleAccountModal" class="modal" onclick="closeGoogleModal()">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 440px; padding: 28px; border-radius: 16px; text-align: left;">
            <div style="text-align: center; margin-bottom: 20px;">
                <svg width="36" height="36" viewBox="0 0 18 18" style="margin-bottom: 8px;">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                <h2 style="font-size: 1.25rem; font-weight: 700; color: #1f2937; margin-bottom: 4px;">Sign in with Google</h2>
                <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Choose or enter your device Google account</p>
            </div>

            <div class="google-accounts-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
                <!-- Fast 1-Click Device Google Account -->
                <div onclick="selectGoogleAccount('S.V.S. Narayana', 'svsnarayana22@gmail.com', 'IECT')" 
                     style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1.5px solid #2563eb; border-radius: 10px; cursor: pointer; background: #eff6ff; transition: background 0.2s;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: #ea580c; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">S</div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; color: #111827; font-size: 0.95rem;">S.V.S. Narayana <span style="font-size: 0.75rem; background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">IECT</span></div>
                        <div style="color: #4b5563; font-size: 0.825rem;">svsnarayana22@gmail.com</div>
                    </div>
                </div>

                <div onclick="selectGoogleAccount('Data Engineer Student', 'de@student.edu', 'DE')" 
                     style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; transition: background 0.2s;"
                     onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='transparent'">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: #059669; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">D</div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; color: #111827; font-size: 0.95rem;">Data Engineer Student <span style="font-size: 0.75rem; background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">DE</span></div>
                        <div style="color: #6b7280; font-size: 0.825rem;">de@student.edu</div>
                    </div>
                </div>
            </div>

            <!-- Inline Custom Account Input Box -->
            <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 16px;">
                <label style="font-size: 0.8rem; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Or Enter Any Google Email on Device:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="email" id="customGoogleEmail" placeholder="yourname@gmail.com" style="flex: 1; padding: 8px 10px; font-size: 0.875rem; border: 1px solid #d1d5db; border-radius: 6px;">
                    <select id="customGoogleDept" style="padding: 8px; font-size: 0.85rem; border: 1px solid #d1d5db; border-radius: 6px; font-weight: 600;">
                        <option value="IECT">IECT</option>
                        <option value="DE">DE</option>
                        <option value="CSE">CSE</option>
                    </select>
                    <button type="button" onclick="submitCustomGoogleAccount()" style="background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 700; cursor: pointer;">Go</button>
                </div>
            </div>

            <div style="text-align: right;">
                <button type="button" class="btn-sm" onclick="closeGoogleModal()" style="background: #e5e7eb; color: #374151; padding: 8px 16px;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Real Google OAuth Client ID placeholder
        const REAL_GOOGLE_CLIENT_ID = ""; // e.g. "1234567890-abc.apps.googleusercontent.com"

        if (REAL_GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.id) {
            google.accounts.id.initialize({
                client_id: REAL_GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
        }

        window.handleCredentialResponse = function(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);
                selectGoogleAccount(payload.name, payload.email, "IECT", payload.sub);
            } catch (e) {
                console.error("JWT Decode Error", e);
            }
        };

        document.getElementById("googleLoginBtn").addEventListener("click", function() {
            if (REAL_GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.id) {
                google.accounts.id.prompt();
            } else {
                document.getElementById("googleAccountModal").style.display = "flex";
            }
        });

        window.closeGoogleModal = function() {
            document.getElementById("googleAccountModal").style.display = "none";
        };

        function submitCustomGoogleAccount() {
            const input = document.getElementById("customGoogleEmail");
            const email = input ? input.value.trim() : "";
            if (!email) return alert("Please enter your Google email address.");
            const dept = document.getElementById("customGoogleDept").value;
            const name = email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, l => l.toUpperCase());
            selectGoogleAccount(name, email, dept);
        }

        async function selectGoogleAccount(name, email, department = "IECT", google_id = null) {
            closeGoogleModal();
            const alertBox = document.getElementById("alertMessage");
            alertBox.style.display = "none";

            try {
                const response = await fetch("/google-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, department, google_id })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("student", JSON.stringify(data.student));
                    alertBox.className = "alert-box success";
                    alertBox.textContent = `Google Sign-In Successful! Welcome, ${data.student.name} (${data.student.department}). Redirecting...`;
                    alertBox.style.display = "block";

                    setTimeout(() => {
                        window.location.href = "student-dashboard.html";
                    }, 600);
                } else {
                    alertBox.className = "alert-box error";
                    alertBox.textContent = data.message || "Google login failed";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Server connection error.";
                alertBox.style.display = "block";
            }
        }

        function promptCustomGoogleAccount() {
            closeGoogleModal();
            const email = prompt("Enter your original Google Account email on this device:", "yourname@gmail.com");
            if (!email) return;
            const name = email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, l => l.toUpperCase());
            const dept = prompt("Select Department (IECT or DE):", "IECT") || "IECT";
            selectGoogleAccount(name, email, dept);
        }

        // Email/Password Login Handler with persistent login
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const alertBox = document.getElementById("alertMessage");

            alertBox.style.display = "none";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("student", JSON.stringify(data.student));
                    alertBox.className = "alert-box success";
                    alertBox.textContent = `Login Successful! Welcome, ${data.student.name}. Redirecting...`;
                    alertBox.style.display = "block";

                    setTimeout(() => {
                        window.location.href = "student-dashboard.html";
                    }, 600);
                } else {
                    alertBox.className = "alert-box error";
                    alertBox.textContent = data.message || "Invalid email or password";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Server connection error. Please ensure server is running.";
                alertBox.style.display = "block";
            }
        });
    </script>

</body>

</html>
